[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "implegym"
version = "0.1.0"
description = "A competitive programming implementation training gym based on Yosupo Library Checker"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ImpleGym Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tomli>=2.0.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-playwright>=0.5.0",
    "hypothesis>=6.111.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]

[project.scripts]
implegym = "implegym.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: End-to-end browser tests with Playwright",
    "benchmark: Performance benchmark tests",
    "property: Property-based generative tests with Hypothesis"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
